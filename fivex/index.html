<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/triring-icon-removebg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IsItTrue</title>
    <script>
      // Applied before React mounts so the correct theme is visible on first
      // paint instead of flashing light before switching to dark.
      (function () {
        try {
          var stored = localStorage.getItem('itt-theme');
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
